apiVersion: apps/v1
kind: Deployment
metadata:
  name: devinterview-backend
  namespace: devinterview-pro
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devinterview-backend
  template:
    metadata:
      labels:
        app: devinterview-backend
    spec:
      containers:
      - name: backend
        image: devinterview/backend:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: devinterview-config
        - secretRef:
            name: devinterview-secrets
        ports:
        - containerPort: 4000
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1024Mi
        livenessProbe:
          httpGet:
            path: /api/questions/categories
            port: 4000
          initialDelaySeconds: 20
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/questions/categories
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: devinterview-pro
spec:
  selector:
    app: devinterview-backend
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devinterview-frontend
  namespace: devinterview-pro
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devinterview-frontend
  template:
    metadata:
      labels:
        app: devinterview-frontend
    spec:
      containers:
      - name: frontend
        image: devinterview/frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: devinterview-pro
spec:
  selector:
    app: devinterview-frontend
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devinterview-ingress
  namespace: devinterview-pro
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - devinterview.pro
    secretName: devinterview-tls
  rules:
  - host: devinterview.pro
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 4000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: devinterview-pro
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: devinterview-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
